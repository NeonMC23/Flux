[package]
name = "flux-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Iced GUI for Flux"
publish = false

[[bin]]
name = "flux"
path = "src/main.rs"

[features]
default = []
# Real audio output (via flux-app → flux-audio's CPAL backend).
# Non-default so ordinary builds stay device-independent; applications
# intended to actually play sound are built with `--features cpal`.
cpal = ["flux-app/cpal"]

[dependencies]
flux-core.workspace = true
flux-app.workspace = true
flux-platform.workspace = true
# `advanced` exposes Iced's native custom-widget drawing API for the
# real waveform line. `tokio` selects iced's tokio-backed runtime, which
# provides `iced::time::every` (the default thread-pool backend has no
# timer) and gives Tasks a multi-threaded executor.
iced = { workspace = true, features = ["advanced", "tokio"] }
