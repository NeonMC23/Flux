[package]
name = "flux-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Terminal interface for Flux"
publish = false

[[bin]]
name = "flux-tui"
path = "src/main.rs"

[features]
default = []
# Real audio output (via flux-app → flux-audio's CPAL backend).
# Non-default so ordinary builds stay device-independent; applications
# intended to actually play sound are built with `--features cpal`.
cpal = ["flux-app/cpal"]

[dependencies]
flux-core.workspace = true
flux-app.workspace = true
crossterm.workspace = true
