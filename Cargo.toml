[workspace]
resolver = "3"
members = [
    "crates/flux-core",
    "crates/flux-library",
    "crates/flux-audio",
    "crates/flux-providers",
    "crates/flux-platform",
    "crates/flux-app",
    "crates/flux-gui",
    "crates/flux-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# iced 0.14.0 requires 1.88; the workspace floor is 1.89 for the
# standard-library exclusive file locking used by library ownership.
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
flux-core = { path = "crates/flux-core" }
flux-library = { path = "crates/flux-library" }
flux-audio = { path = "crates/flux-audio" }
flux-platform = { path = "crates/flux-platform" }
flux-app = { path = "crates/flux-app" }
iced = "0.14.0"
# Terminal interface (M4). MIT (crates.io), MSRV 1.63. Minimal feature
# set: synchronous events (poll/read) everywhere plus the Windows
# backend; no async event-stream, bracketed-paste, or OSC52.
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
# Locked metadata reader. License: MIT OR Apache-2.0 (crates.io);
# changing the lofty version is a separate dependency decision.
lofty = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5.0"
# Audio (M3). All verified permissive on crates.io; see deny.toml policy.
claxon = "0.4" # FLAC decoding. Apache-2.0, zero dependencies.
hound = "3.5" # WAV decoding. Apache-2.0, zero dependencies.
ringbuf = "0.5" # SPSC ring buffer between decoder and output. MIT OR Apache-2.0.
cpal = "0.18" # Audio output (WASAPI/CoreAudio/ALSA). Apache-2.0. Optional; see flux-audio.
# Audio (M5 format decoders). All permissive per crates.io metadata and
# verified with `cargo deny check licenses` (see README for the support
# matrix and the reasons this hybrid was chosen over a single framework).
# rmp3: minimp3 (public domain/CC0-1.0) compiled via the `cc` build
# dependency, scalar (no SIMD) for portability, f32 PCM output.
rmp3 = { version = "0.3", default-features = false, features = ["float"] }
lewton = { version = "0.10", default-features = false } # Vorbis decoding. MIT OR Apache-2.0. (Ogg demuxing is ours via `ogg`.)
ogg = "0.9" # Ogg container demuxing. BSD-3-Clause.
opus-pure = "0.2" # Opus decoding, pure Rust. BSD-3-Clause, zero dependencies.
rusty_aac = "1.1" # AAC decoding, pure Rust. Apache-2.0, zero dependencies.
mp4 = "0.14" # MP4/M4A container demuxing. MIT.
