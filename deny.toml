# cargo-deny policy for Flux.
#
# Project code in this repository is MIT-licensed (see LICENSE). This file
# defines which third-party dependency licenses are acceptable. The check is
# reproducible locally and in CI with:
#
#   cargo deny check licenses
#
# The allow-list below was derived from the actual locked dependency tree
# (Cargo.lock / `cargo metadata`) at M0 and contains only permissive
# licenses. Copyleft licenses are denied: crates that *offer* a permissive
# alternative in an OR expression (for example `Apache-2.0 OR GPL-2.0-only`)
# still pass, because the permissive option is the one effectively used.
# Do not add licenses or per-crate exceptions to this file without checking
# the actual license text of the crate in question.

[licenses]
# Workspace crates are `publish = false` and covered by the repository
# LICENSE file; exclude them from the third-party check.
private = { ignore = true }
# Deny-by-default: with an allow-list present, a dependency fails the
# check unless one of its license options is listed below. Copyleft
# licenses are not listed, so any crate whose only licensing options are
# copyleft fails the check.
unused-allowed-license = "warn"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    # Required by unicode-ident: (MIT OR Apache-2.0) AND Unicode-3.0
    "Unicode-3.0",
]

[bans]
# Duplicate versions of the same crate are currently introduced transitively
# by the Iced dependency tree and cannot be controlled by this workspace.
# Report them so growth stays visible; revisit when dependencies change.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io is an acceptable source for dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
