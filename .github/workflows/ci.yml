# Continuous integration for Flux.
#
# Runs formatting, Clippy, dependency-license checks, tests, and builds.
# The optional CPAL audio backend (flux-audio `cpal` feature) is
# compile-checked on every platform; CI runners provide no usable audio
# device, so compilation here is never evidence of audible playback.
# This workflow runs release-mode packaging jobs only on manual dispatch and
# uploads private workflow artifacts for review. It never publishes a release,
# creates a tag, signs with an unavailable identity, or uploads binaries
# publicly.
#
# The Rust toolchain is pinned by rust-toolchain.toml at the repository
# root; rustup (preinstalled on GitHub-hosted runners) installs exactly
# that toolchain. Tests execute natively on every matrix entry below
# except the macOS x86_64 job, which is a compile-only cross-check
# because GitHub provides no standard macOS x86_64 runner.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and Clippy (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libasound2-dev desktop-file-utils appstream python3-pil
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustc --version
          cargo --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy — CPAL features (warnings denied)
        run: cargo clippy -p flux-audio -p flux-app -p flux-gui -p flux-tui --features cpal --all-targets --locked -- -D warnings
      - name: Validate packaging integration metadata
        run: |
          desktop-file-validate packaging/linux/io.github.neonmc23.flux.desktop
          appstreamcli validate --no-net packaging/linux/io.github.neonmc23.flux.metainfo.xml
          bash -n packaging/linux/build-packages.sh
          bash -n packaging/linux/validate-packages.sh
          bash -n packaging/macos/build-macos.sh
          bash -n packaging/macos/verify-macos.sh
          test -f assets/icons/flux.ico
          test -f assets/icons/flux.icns
          test -f assets/icons/flux-256.png
          python3 - <<'PY'
          from PIL import Image
          for size in (16, 32, 64, 256, 1024):
              image = Image.open(f"assets/icons/flux-{size}.png")
              assert image.size == (size, size), (size, image.size)
          ico = Image.open("assets/icons/flux.ico")
          assert ico.size[0] >= 16
          icns = open("assets/icons/flux.icns", "rb").read()
          assert icns[:4] == b"icns" and int.from_bytes(icns[4:8], "big") == len(icns)
          PY

  licenses:
    name: Dependency licenses (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustc --version
      - name: Install cargo-deny 0.20.2 (checksum-verified)
        run: |
          curl -fsSL -o /tmp/cargo-deny.tar.gz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  /tmp/cargo-deny.tar.gz" | sha256sum --check
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp
          install -m755 /tmp/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny "$HOME/.cargo/bin/cargo-deny"
          cargo-deny --version
      - name: Check dependency licenses
        run: cargo deny check licenses

  test-build:
    name: Test and build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - label: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - label: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - label: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libasound2-dev
      - name: Install pinned Rust toolchain and target
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
          rustc --version
          cargo --version
      - name: Check all targets (native)
        run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}
      - name: Test workspace (native)
        run: cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Build workspace (native)
        run: cargo build --workspace --locked --target ${{ matrix.target }}
      # Compile/link only: runners have no usable audio device, so these
      # steps never constitute a playback test.
      - name: Compile-check CPAL features
        run: cargo check -p flux-audio -p flux-app -p flux-gui -p flux-tui --features cpal --all-targets --locked --target ${{ matrix.target }}
      - name: Build CPAL binaries (compile/link only)
        run: cargo build -p flux-gui -p flux-tui --features cpal --locked --target ${{ matrix.target }}

  macos-x86_64-cross-check:
    name: Compile-only cross-check (macOS x86_64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain and target
        run: |
          rustup show
          rustup target add x86_64-apple-darwin
          rustc --version
      # Compile-only: binaries for x86_64-apple-darwin are not executed on
      # this ARM64 runner, so no test or run step is claimed here.
      - name: Check workspace for x86_64-apple-darwin
        run: cargo check --workspace --all-targets --locked --target x86_64-apple-darwin
      - name: Check CPAL features for x86_64-apple-darwin
        run: cargo check -p flux-audio -p flux-app -p flux-gui -p flux-tui --features cpal --all-targets --locked --target x86_64-apple-darwin

  # Release-engineering artifacts. These jobs run only on manual dispatch and
  # upload private GitHub Actions artifacts for review; they never create a
  # release or publish binaries. Checksums are generated next to each artifact.
  package-linux:
    name: Package Linux (${{ matrix.label }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64
            runner: ubuntu-24.04
            arch: x86_64
          - label: arm64
            runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v5
      - name: Install packaging and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libasound2-dev rpm
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustc --version
          cargo --version
      - name: Build and package
        env:
          FLUX_ARCH: ${{ matrix.arch }}
        run: packaging/linux/build-packages.sh
      - name: Validate packages
        env:
          FLUX_ARCH: ${{ matrix.arch }}
        run: packaging/linux/validate-packages.sh
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flux-linux-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Flux-*-linux-*.tar.gz
            dist/Flux-*-linux-*.deb
            dist/Flux-*-linux-*.rpm
            dist/SHA256SUMS-linux-*.txt

  package-windows:
    name: Package Windows (${{ matrix.label }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64
            runner: windows-2025
            arch: x86_64
            installer: "yes"
          - label: arm64
            runner: windows-11-arm
            arch: arm64
            installer: "no"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustc --version
          cargo --version
      - name: Install Inno Setup (x64 installer job)
        if: matrix.installer == 'yes'
        run: choco install innosetup --no-progress -y
      - name: Build and package
        shell: pwsh
        run: |
          if ('${{ matrix.installer }}' -eq 'yes') {
            ./packaging/windows/build-windows.ps1 -Architecture '${{ matrix.arch }}'
          } else {
            ./packaging/windows/build-windows.ps1 -Architecture '${{ matrix.arch }}' -SkipInstaller
          }
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          if ('${{ matrix.installer }}' -eq 'yes') {
            ./packaging/windows/verify-windows.ps1 -Architecture '${{ matrix.arch }}' -TestInstaller
          } else {
            ./packaging/windows/verify-windows.ps1 -Architecture '${{ matrix.arch }}'
          }
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flux-windows-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Flux-*-windows-*.zip
            dist/Flux-*-windows-*-setup.exe
            dist/SHA256SUMS-windows.txt

  package-macos:
    name: Package macOS (ARM64)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustc --version
          cargo --version
      - name: Build and package
        env:
          FLUX_ARCH: arm64
        run: packaging/macos/build-macos.sh
      - name: Verify macOS artifacts
        env:
          FLUX_ARCH: arm64
        run: packaging/macos/verify-macos.sh
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flux-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Flux-*-macos-*/*.zip
            dist/Flux-*-macos-*/*.dmg
            dist/SHA256SUMS-macos-*.txt
